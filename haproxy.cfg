global
  log stdout format raw local0

defaults
  log global
  mode tcp
  timeout connect 5s
  timeout client  60s
  timeout server  60s

# Writes -> current primary
frontend pg_write
  bind *:15432
  default_backend be_primary

backend be_primary
  option httpchk HEAD /primary
  http-check expect status 200
  default-server inter 2s fall 3 rise 2
  server n1 10.0.1.2:5432 check port 8008 check-ssl verify required ca-file /etc/haproxy/pki/ca.crt verifyhost 10.0.1.2
  server n2 10.0.1.3:5432 check port 8008 check-ssl verify required ca-file /etc/haproxy/pki/ca.crt verifyhost 10.0.1.3
  server n3 10.0.1.4:5432 check port 8008 check-ssl verify required ca-file /etc/haproxy/pki/ca.crt verifyhost 10.0.1.4

# Reads -> current replicas
frontend pg_read
  bind *:15433
  default_backend be_replicas

backend be_replicas
  balance roundrobin
  option httpchk HEAD /replica
  http-check expect status 200
  default-server inter 2s fall 3 rise 2
  server n1 10.0.1.2:5432 check port 8008 check-ssl verify required ca-file /etc/haproxy/pki/ca.crt verifyhost 10.0.1.2
  server n2 10.0.1.3:5432 check port 8008 check-ssl verify required ca-file /etc/haproxy/pki/ca.crt verifyhost 10.0.1.3
  server n3 10.0.1.4:5432 check port 8008 check-ssl verify required ca-file /etc/haproxy/pki/ca.crt verifyhost 10.0.1.4
